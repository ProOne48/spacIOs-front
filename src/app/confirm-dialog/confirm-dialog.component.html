@if (data.type && confirmData?.icon) {
<mat-icon [ngClass]="data.type + '-icon'">{{ confirmData?.icon }}</mat-icon>
} @if (data.title) {
<h2 class="center">{{ data.title }}</h2>
} @if (data.message) {
<p>{{ data.message }}</p>
}
<div class="row gap-sm center">
  <button mat-raised-button (click)="confirmAndClose()" class="btn btn--primary">
    {{ confirmData?.confirmText }}
  </button>
  <button mat-raised-button (click)="closeDialog()" class="btn btn--secondary">Cancel</button>
</div>
