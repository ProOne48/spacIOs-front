<ng-container>
  <h2 data-cy="board-info-modal-title" mat-dialog-title>{{ data ? 'Edit' : 'Create' }} a table</h2>
  <div data-cy="board-info-modal" mat-dialog-content>
    <div class="form-container">
      <form class="form-wrapper" [formGroup]="form">
        <mat-form-field>
          <mat-label>Table Number</mat-label>
          <input matInput placeholder="Table number" formControlName="tableNumber" type="number" [min]="1" />

          @if (form.get('tableNumber')?.hasError('required')) {
          <mat-error> Table number is <strong>required</strong> </mat-error>
          } @if (form.get('tableNumber')?.hasError('min')) {
          <mat-error> Table number must be <strong>greater than 0</strong> </mat-error>
          }
        </mat-form-field>

        <mat-form-field>
          <mat-label>Number of chairs</mat-label>
          <input matInput placeholder="Number of chairs" formControlName="nChairs" type="number" [min]="1" [max]="50" />
        </mat-form-field>

        <div class="row vertical-center">
          <p>Reservable</p>
          <mat-checkbox formControlName="reservable" />
        </div>
      </form>
    </div>
    <div mat-dialog-actions>
      <button mat-raised-button class="btn" data-cy="board-info-modal-close" (click)="closeModal()">Cancel</button>
      <button
        mat-raised-button
        class="btn btn--primary"
        data-cy="board-info-modal-accept"
        [mat-dialog-close]="form.value"
        [disabled]="form.invalid"
      >
        {{ data ? 'Edit' : 'Add' }} table
      </button>
    </div>
  </div>
</ng-container>
