<mat-card>
  <mat-card-header>
    <mat-card-title>
      {{ place().name }}
    </mat-card-title>

    <mat-card-subtitle>
      {{ place().address }}
    </mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    @if (place().phoneNumber) {
    <p>
      <mat-icon>phone</mat-icon>
      {{ place().phoneNumber }}
    </p>
    } @if (place().rating) {
    <p>
      <mat-icon>star</mat-icon>
      {{ place().rating }}
      ({{ place().totalRatings }})
    </p>
    }
  </mat-card-content>

  <mat-card-actions>
    @if (place().googleMapsUrl) {
    <a mat-button [href]="place().googleMapsUrl" target="_blank" rel="noopener noreferrer"> Ver en Google Maps </a>
    }
  </mat-card-actions>
</mat-card>
