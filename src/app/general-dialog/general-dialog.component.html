@if (data.icon) {
<mat-icon>{{ data.icon }}</mat-icon>
} @if (data.title) {
<h2>{{ data.title }}</h2>
} @if (data.message) {
<p>{{ data.message }}</p>
} @if (data.action) {
<button mat-raised-button (click)="data.action()">
  {{ data.confirmText }}
</button>
}
<button mat-raised-button (click)="closeDialog()">Cancel</button>
