<mat-icon *ngIf="data.icon">{{ data.icon }}</mat-icon>
<h2 *ngIf="data.title">{{ data.title }}</h2>
<p *ngIf="data.message">{{ data.message }}</p>
<ng-container *ngIf="data.action">
  <button mat-raised-button (click)="data.action()">
    {{ data.confirmText }}
  </button>
</ng-container>
<button mat-raised-button (click)="closeDialog()">Cancel</button>
